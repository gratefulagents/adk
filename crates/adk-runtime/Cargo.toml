[package]
name = "adk-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Standalone ADK execution engine, streaming, approvals and owned Tokio lifecycles"

[dependencies]
adk-core.workspace = true
adk-durable = { version = "0.1.0", path = "../adk-durable", default-features = false }
serde.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
adk-codec.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde_json.workspace = true
schemars.workspace = true
sha2 = "0.10"
jsonschema = { version = "0.33", default-features = false }

uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
