[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
confidence-threshold = 0.95
# borrow-or-share (via jsonschema/referencing) uses MIT's no-attribution variant.
allow = ["MIT", "MIT-0", "Apache-2.0", "Unicode-3.0", "GPL-3.0-only", "AGPL-3.0-only"]
# Reviewed TLS transport dependencies; exact versions keep future changes visible.
# See docs/migration/provider-research.md. Do not broaden the global allow-list.
exceptions = [
  { name = "ring", version = "=0.17.14", allow = ["Apache-2.0", "ISC"] },
  { name = "rustls-webpki", version = "=0.103.15", allow = ["ISC"] },
  { name = "untrusted", version = "=0.9.0", allow = ["ISC"] },
  { name = "subtle", version = "=2.6.1", allow = ["BSD-3-Clause"] },
  { name = "webpki-roots", version = "=1.0.9", allow = ["CDLA-Permissive-2.0"] },
]

[bans]
multiple-versions = "deny"
wildcards = "deny"
# ring's OS bindings/RNG intentionally coexist with the runtime's newer APIs.
skip = [
  { name = "getrandom", version = "=0.2.17" },
  { name = "windows-sys", version = "=0.52.0" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
