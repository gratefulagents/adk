[package]
name = "adk-providers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
runtime = ["dep:adk-runtime"]

[dependencies]
adk-core.workspace = true
adk-runtime = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
thiserror.workspace = true
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "json", "stream"] }
sha2 = "0.10"
httpdate = "1"
base64 = "=0.22.1"
time = { version = "=0.3.47", features = ["parsing", "formatting"] }

[dev-dependencies]
adk-runtime.workspace = true
