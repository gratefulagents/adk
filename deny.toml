[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
confidence-threshold = 0.95
allow = ["MIT", "Apache-2.0", "Unicode-3.0", "GPL-3.0-only", "AGPL-3.0-only"]

[bans]
multiple-versions = "deny"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
