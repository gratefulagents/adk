[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
confidence-threshold = 0.95
# borrow-or-share (via jsonschema/referencing) uses MIT's no-attribution variant.
allow = ["MIT", "MIT-0", "Apache-2.0", "Unicode-3.0", "GPL-3.0-only", "AGPL-3.0-only"]
# Reviewed TLS transport dependencies; exact versions keep future changes visible.
# See docs/migration/provider-research.md. Do not broaden the global allow-list.
exceptions = [
  { name = "ring", version = "=0.17.14", allow = ["Apache-2.0", "ISC"] },
  { name = "rustls-webpki", version = "=0.103.15", allow = ["ISC"] },
  { name = "untrusted", version = "=0.9.0", allow = ["ISC"] },
  { name = "subtle", version = "=2.6.1", allow = ["BSD-3-Clause"] },
  # axum's route matcher; matchit's bundled httprouter BSD notice is retained in NOTICE.md.
  { name = "matchit", version = "=0.8.4", allow = ["BSD-3-Clause"] },
  { name = "webpki-roots", version = "=1.0.9", allow = ["CDLA-Permissive-2.0"] },
  # SQLite hashlink dependency; retained Zlib notice reviewed in durable research.
  { name = "foldhash", version = "=0.1.5", allow = ["Zlib"] },
]

[bans]
multiple-versions = "deny"
wildcards = "deny"
# ring's OS bindings/RNG intentionally coexist with the runtime's newer APIs.
skip = [
  # html5ever atom generation uses phf 0.14; tokio-postgres retains 0.13.
  { name = "phf", version = "=0.13.1" },
  { name = "phf_shared", version = "=0.13.1" },
  { name = "getrandom", version = "=0.2.17" },
  { name = "windows-sys", version = "=0.52.0" },
  # Existing ahash/jsonschema RNG and proc-macro ecosystem use distinct majors.
  { name = "getrandom", version = "=0.3.4" },
  { name = "r-efi", version = "=5.3.0" },
  { name = "syn", version = "=2.0.119" },
  # rust-postgres uses current RustCrypto; existing SDK SHA1/SHA2 uses 0.10.
  { name = "block-buffer", version = "=0.10.4" },
  { name = "cpufeatures", version = "=0.2.17" },
  { name = "crypto-common", version = "=0.1.7" },
  { name = "digest", version = "=0.10.7" },
  { name = "sha2", version = "=0.10.9" },
  # PostgreSQL and SQLite require different fallible-iterator APIs.
  { name = "fallible-iterator", version = "=0.2.0" },
  # SQLite hashlink retains 0.15; YAML indexmap uses hashbrown 0.17.
  { name = "hashbrown", version = "=0.15.5" },
  # whoami (Postgres) and mio/ring use different WASI generations.
  { name = "wasi", version = "=0.11.1+wasi-snapshot-preview1" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
