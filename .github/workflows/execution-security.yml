name: Execution security
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  enforcing-backends:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      - name: Install Bubblewrap
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          bwrap --version
          # Disposable CI runner only: permit the user namespaces being tested.
          # Deployment hosts must supply their own approved namespace policy.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Require functional OS enforcement and lifecycle regressions
        env:
          ADK_REQUIRE_SANDBOX: '1'
        run: cargo test --locked -p adk-sandbox -p adk-security --all-targets
      - name: Public execution feature
        run: cargo test --locked -p adk --no-default-features --features execution --all-targets
      - name: Seatbelt denial diagnostics
        if: failure() && runner.os == 'macOS'
        run: |
          sudo /usr/bin/log show --last 3m --style compact --predicate 'eventMessage CONTAINS "Sandbox:" OR process == "sandboxd"' | tail -100
          python3 scripts/seatbelt-diagnostics.py
          cc scripts/stack-probe.c -o "$RUNNER_TEMP/stack-probe"
          "$RUNNER_TEMP/stack-probe"
          cp crates/adk-sandbox/src/seatbelt-base.sb "$RUNNER_TEMP/stack-probe.sb"
          # Diagnostic process only; no production policy change.
          echo '(allow file-read*)' >> "$RUNNER_TEMP/stack-probe.sb"
          /usr/bin/sandbox-exec -f "$RUNNER_TEMP/stack-probe.sb" /usr/bin/env -i "$RUNNER_TEMP/stack-probe"
  unsupported-target:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      - name: Unsupported targets compile and fail closed
        run: cargo test --locked -p adk-sandbox -p adk-security --all-targets
