[workspace]
resolver = "3"
members = ["crates/adk-tools", "crates/adk-security", "crates/adk-sandbox", "crates/adk-durable", "crates/adk-project-state", "crates/adk-providers", "crates/adk-core", "crates/adk-codec", "crates/adk-runtime", "crates/adk", "crates/adk-platform", "bins/adk-agent", "bins/adk-harness"]
default-members = ["crates/adk", "crates/adk-core", "crates/adk-codec"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-only"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
schemars = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
adk-core = { version = "0.1.0", path = "crates/adk-core" }
adk-codec = { version = "0.1.0", path = "crates/adk-codec" }
adk-runtime = { version = "0.1.0", path = "crates/adk-runtime" }
adk = { version = "0.1.0", path = "crates/adk", default-features = false }
adk-platform = { version = "0.1.0", path = "crates/adk-platform" }
